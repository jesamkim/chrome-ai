<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- 헤더 -->
        <header class="popup-header">
            <div class="header-content">
                <h1>🤖 Claude AI</h1>
                <div class="header-actions">
                    <button id="settingsBtn" class="icon-btn" title="설정">⚙️</button>
                    <button id="refreshBtn" class="icon-btn" title="새로고침">🔄</button>
                </div>
            </div>
            <div class="connection-status" id="connectionStatus">
                <span class="status-indicator" id="statusIndicator"></span>
                <span class="status-text" id="statusText">연결 확인 중...</span>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="popup-main">
            <!-- API Key 설정 필요 화면 -->
            <div id="setupScreen" class="screen" style="display: none;">
                <div class="setup-content">
                    <div class="setup-icon">🔑</div>
                    <h2>설정이 필요합니다</h2>
                    <p>Claude AI Assistant를 사용하려면<br>먼저 API Key를 설정해주세요.</p>
                    <button id="openSettingsBtn" class="btn btn-primary">설정 페이지 열기</button>
                </div>
            </div>

            <!-- 페이지 분석 화면 -->
            <div id="analysisScreen" class="screen">
                <div class="page-info">
                    <div class="page-title" id="pageTitle">페이지 로딩 중...</div>
                    <div class="page-url" id="pageUrl"></div>
                </div>

                <div class="analysis-section">
                    <div class="section-header">
                        <h3>📄 페이지 분석</h3>
                        <button id="analyzeBtn" class="btn btn-small">분석하기</button>
                    </div>
                    <div class="analysis-content" id="analysisContent">
                        <div class="analysis-placeholder">
                            페이지를 분석하려면 '분석하기' 버튼을 클릭하세요.
                        </div>
                    </div>
                </div>

                <div class="quick-actions">
                    <h3>⚡ 빠른 작업</h3>
                    <div class="action-buttons">
                        <button id="summarizeBtn" class="action-btn">
                            <span class="action-icon">📝</span>
                            <span class="action-text">요약</span>
                        </button>
                        <button id="keyPointsBtn" class="action-btn">
                            <span class="action-icon">🎯</span>
                            <span class="action-text">핵심 포인트</span>
                        </button>
                        <button id="translateBtn" class="action-btn">
                            <span class="action-icon">🌐</span>
                            <span class="action-text">번역</span>
                        </button>
                        <button id="chatBtn" class="action-btn">
                            <span class="action-icon">💬</span>
                            <span class="action-text">채팅</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 채팅 화면 -->
            <div id="chatScreen" class="screen" style="display: none;">
                <div class="chat-header">
                    <button id="backToAnalysisBtn" class="back-btn">← 뒤로</button>
                    <h3>💬 Claude와 대화</h3>
                    <button id="clearChatBtn" class="icon-btn" title="대화 초기화">🗑️</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <div class="message assistant">
                            <div class="message-content">
                                안녕하세요! 현재 페이지에 대해 궁금한 것이 있으시면 언제든 물어보세요. 😊
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea id="chatInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                        <button id="sendBtn" class="send-btn" disabled>
                            <span class="send-icon">📤</span>
                        </button>
                    </div>
                    <div class="input-actions">
                        <button id="voiceBtn" class="input-action-btn" title="음성 입력">🎤</button>
                        <button id="attachBtn" class="input-action-btn" title="파일 첨부">📎</button>
                        <span class="char-count" id="charCount">0/2000</span>
                    </div>
                </div>
            </div>

            <!-- 로딩 화면 -->
            <div id="loadingScreen" class="screen loading-screen" style="display: none;">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" id="loadingText">처리 중...</div>
                </div>
            </div>
        </main>

        <!-- 푸터 -->
        <footer class="popup-footer">
            <div class="footer-info">
                <span class="model-info">Claude 3.7 Sonnet</span>
                <span class="version-info">v1.0.0</span>
            </div>
            <div class="footer-actions">
                <button id="helpBtn" class="footer-btn" title="도움말">❓</button>
                <button id="feedbackBtn" class="footer-btn" title="피드백">💌</button>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
